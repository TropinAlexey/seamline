apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: seamline-observability
  labels:
    app: otel-collector
    {{- include "seamline.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
          resources:
            requests:
              memory: "64Mi"   # collector with batch processor and two exporters; measured ~40MB idle
              cpu: "50m"       # pass-through pipeline, minimal CPU
            limits:
              memory: "256Mi"  # headroom for burst of traces/metrics from all 3 app processes
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
