services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seamline
      POSTGRES_USER: seamline
      POSTGRES_PASSWORD: seamline
    ports:
      - "5432:5432"
    volumes:
      - seamline-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seamline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Custom image with delayed-message-exchange plugin for the credit-approval
  # saga timeout (ADR-0017).
  rabbitmq:
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 30s
      retries: 10

  # Stand-in for ACER's trade-report intake (ADR-0015).
  acer-stub:
    build:
      context: .
      dockerfile: src/Seamline.AcerStub/Dockerfile
    ports:
      - "5299:8080"

  api:
    build:
      context: .
      dockerfile: src/Seamline.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=seamline;Username=seamline_app;Password=seamline_app"
      ConnectionStrings__PostgresMigrator: "Host=postgres;Database=seamline;Username=seamline;Password=seamline"
      MessageBroker__Transport: RabbitMq
      MessageBroker__RabbitMq__Host: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  valuation-worker:
    build:
      context: .
      dockerfile: src/Seamline.Valuation.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=seamline;Username=seamline_app;Password=seamline_app"
      ConnectionStrings__PostgresMigrator: "Host=postgres;Database=seamline;Username=seamline;Password=seamline"
    depends_on:
      postgres:
        condition: service_healthy

  reporting-worker:
    build:
      context: .
      dockerfile: src/Seamline.Reporting.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=seamline;Username=seamline_app;Password=seamline_app"
      ConnectionStrings__PostgresMigrator: "Host=postgres;Database=seamline;Username=seamline;Password=seamline"
      AcerStub__BaseUrl: "http://acer-stub:8080"
    depends_on:
      postgres:
        condition: service_healthy
      acer-stub:
        condition: service_started

volumes:
  seamline-postgres-data:
