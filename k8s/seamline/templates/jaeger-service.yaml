apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: seamline-observability
  labels:
    app: jaeger
    {{- include "seamline.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: ui
      port: 16686
      targetPort: 16686
  selector:
    app: jaeger
