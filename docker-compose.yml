services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seamline
      POSTGRES_USER: seamline
      POSTGRES_PASSWORD: seamline
    ports:
      - "5432:5432"
    volumes:
      - seamline-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seamline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Custom image with delayed-message-exchange plugin for the credit-approval
  # saga timeout (ADR-0017).
  rabbitmq:
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 30s
      retries: 10

  # Stand-in for ACER's trade-report intake (ADR-0015).
  acer-stub:
    build:
      context: .
      dockerfile: src/Seamline.AcerStub/Dockerfile
    ports:
      - "5299:8080"

  api:
    build:
      context: .
      dockerfile: src/Seamline.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=seamline;Username=seamline_app;Password=seamline_app"
      ConnectionStrings__PostgresMigrator: "Host=postgres;Database=seamline;Username=seamline;Password=seamline"
      MessageBroker__Transport: RabbitMQ
      MessageBroker__RabbitMq__Host: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  valuation-worker:
    build:
      context: .
      dockerfile: src/Seamline.Valuation.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=seamline;Username=seamline_app;Password=seamline_app"
      ConnectionStrings__PostgresMigrator: "Host=postgres;Database=seamline;Username=seamline;Password=seamline"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy

  reporting-worker:
    build:
      context: .
      dockerfile: src/Seamline.Reporting.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=seamline;Username=seamline_app;Password=seamline_app"
      ConnectionStrings__PostgresMigrator: "Host=postgres;Database=seamline;Username=seamline;Password=seamline"
      AcerStub__BaseUrl: "http://acer-stub:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      acer-stub:
        condition: service_started

  # --- Observability stack (local dev only) ---
  # In cloud, OTEL_EXPORTER_OTLP_ENDPOINT points at the provider's managed
  # OTLP intake (CloudWatch, Application Insights) — no sidecar needed.
  # See ADR-0019: "telemetry — identical. OTLP export is endpoint-only."

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.4.2
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.6.0
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  seamline-postgres-data:
