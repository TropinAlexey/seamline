apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: seamline-observability
  labels:
    app: prometheus
    {{- include "seamline.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.4.2
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=1h"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "128Mi"  # prometheus with 1h retention and ~10 scrape targets
              cpu: "100m"      # scraping + TSDB writes are lightweight at this scale
            limits:
              memory: "512Mi"  # headroom for TSDB compaction and query spikes
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
