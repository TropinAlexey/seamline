apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: seamline-observability
  labels:
    {{- include "seamline.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8889"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]
