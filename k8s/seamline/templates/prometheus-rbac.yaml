apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: seamline-observability
  labels:
    {{- include "seamline.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: seamline-prometheus
  labels:
    {{- include "seamline.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: seamline-prometheus
  labels:
    {{- include "seamline.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: seamline-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: seamline-observability
