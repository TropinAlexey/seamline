apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: seamline-observability
  labels:
    {{- include "seamline.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: seamline
        type: file
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
