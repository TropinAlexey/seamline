apiVersion: v1
kind: Secret
metadata:
  name: seamline-secrets
  namespace: seamline
  labels:
    {{- include "seamline.labels" . | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=seamline-postgres;Database=seamline;Username=seamline_app;Password=seamline_app"
  ConnectionStrings__PostgresMigrator: "Host=seamline-postgres;Database=seamline;Username=seamline;Password=seamline"
  Jwt__SigningKey: "dev-only-signing-key-not-for-production-use-seamline-mini-ctrm"
