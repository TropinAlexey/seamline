apiVersion: batch/v1
kind: Job
metadata:
  name: seamline-migration
  namespace: seamline
  labels:
    app: seamline-migration
    {{- include "seamline.labels" . | nindent 4 }}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: seamline-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.images.api }}
          args: ["--migrate-only"]
          envFrom:
            - configMapRef:
                name: seamline-config
            - secretRef:
                name: seamline-secrets
          resources:
            requests:
              memory: "128Mi"  # migrations are short-lived; 128Mi covers EF Core + Npgsql overhead
              cpu: "100m"      # DDL is I/O-bound, not CPU-bound
            limits:
              memory: "512Mi"  # ceiling for large migration batches
              cpu: "500m"
