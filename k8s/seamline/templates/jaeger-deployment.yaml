apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: seamline-observability
  labels:
    app: jaeger
    {{- include "seamline.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - name: SPAN_STORAGE_TYPE
              value: "memory"
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 4317   # OTLP gRPC
            - containerPort: 16686  # UI
          resources:
            requests:
              memory: "64Mi"   # all-in-one with in-memory storage; ~50MB baseline
              cpu: "50m"       # minimal CPU for local trace volumes
            limits:
              memory: "256Mi"  # in-memory span storage grows; 256Mi caps it for demo
              cpu: "200m"
