name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SeamlineCtrm.sln

      - name: Build
        run: dotnet build SeamlineCtrm.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SeamlineCtrm.sln --configuration Release --no-build --logger "console;verbosity=normal"
