name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECS_CLUSTER: seamline

jobs:
  # ── AWS: build → push to ECR ──────────────────────────────────
  aws-build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: seamline-api
            dockerfile: src/Seamline.Api/Dockerfile
            ecs_service: api
          - service: seamline-valuation-worker
            dockerfile: src/Seamline.Valuation.Worker/Dockerfile
            ecs_service: valuation-worker
          - service: seamline-reporting-worker
            dockerfile: src/Seamline.Reporting.Worker/Dockerfile
            ecs_service: reporting-worker
          - service: seamline-acer-stub
            dockerfile: src/Seamline.AcerStub/Dockerfile
            ecs_service: acer-stub
          - service: seamline-rabbitmq
            dockerfile: docker/rabbitmq/Dockerfile
            ecs_service: rabbitmq

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f ${{ matrix.dockerfile }} -t $REGISTRY/${{ matrix.service }}:$IMAGE_TAG -t $REGISTRY/${{ matrix.service }}:latest .
          docker push $REGISTRY/${{ matrix.service }}:$IMAGE_TAG
          docker push $REGISTRY/${{ matrix.service }}:latest

      # ponytail: ECS deploy disabled until infra is provisioned via terraform
      # - name: Deploy to ECS
      #   run: aws ecs update-service --cluster $ECS_CLUSTER --service ${{ matrix.ecs_service }} --force-new-deployment --no-cli-pager

  # ── Azure: build → push to ACR, validate Bicep ────────────────
  # ponytail: job skipped until Azure OIDC secrets are configured;
  # secrets context unavailable in job-level `if:`, so we gate via env.
  azure-build-and-push:
    runs-on: ubuntu-latest
    env:
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
    strategy:
      matrix:
        include:
          - service: seamline-api
            dockerfile: src/Seamline.Api/Dockerfile
          - service: seamline-valuation-worker
            dockerfile: src/Seamline.Valuation.Worker/Dockerfile
          - service: seamline-reporting-worker
            dockerfile: src/Seamline.Reporting.Worker/Dockerfile
          - service: seamline-acer-stub
            dockerfile: src/Seamline.AcerStub/Dockerfile

    steps:
      - uses: actions/checkout@v5
        if: env.HAS_AZURE == 'true'

      - name: Azure login (OIDC)
        if: env.HAS_AZURE == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: env.HAS_AZURE == 'true'
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push
        if: env.HAS_AZURE == 'true'
        env:
          REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f ${{ matrix.dockerfile }} -t $REGISTRY/${{ matrix.service }}:$IMAGE_TAG -t $REGISTRY/${{ matrix.service }}:latest .
          docker push $REGISTRY/${{ matrix.service }}:$IMAGE_TAG
          docker push $REGISTRY/${{ matrix.service }}:latest

      # ponytail: Container Apps deploy disabled until infra is provisioned via bicep
      # - name: Deploy to Container Apps
      #   run: az containerapp update --name seamline-api --resource-group seamline --image $REGISTRY/${{ matrix.service }}:$IMAGE_TAG

  azure-validate-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Bicep (offline)
        run: az bicep build --file infra/azure/main.bicep

      # what-if requires an authenticated subscription; enable when provisioned
      # - name: Azure login (OIDC)
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # - name: What-if
      #   run: az deployment group what-if --resource-group seamline --template-file infra/azure/main.bicep --parameters dbOwnerPassword=placeholder dbAppPassword=placeholder
